<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Style A – Dark Navy Signal</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #08111e; }

  :root {
    --bg: #08111e;
    --accent: #1a9fd9;
    --accent-glow: rgba(26, 159, 217, 0.25);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.55);
  }

  .slide {
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: clamp(2rem, 5vw, 5rem);
    position: relative;
    background:
      radial-gradient(ellipse at 70% 20%, rgba(26,159,217,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 10% 90%, rgba(26,159,217,0.10) 0%, transparent 50%),
      #08111e;
  }

  /* diagonal grid overlay */
  .slide::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(26,159,217,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,159,217,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* large accent bar top */
  .accent-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 70%);
  }

  /* corner number */
  .slide-num {
    position: absolute; top: clamp(1.5rem,3vw,3rem); right: clamp(1.5rem,3vw,3rem);
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(5rem, 12vw, 11rem);
    color: rgba(26,159,217,0.08);
    line-height: 1;
    pointer-events: none;
    letter-spacing: -0.04em;
  }

  /* tag label */
  .tag {
    display: inline-block;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(0.6rem, 1vw, 0.8rem);
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(26,159,217,0.12);
    border: 1px solid rgba(26,159,217,0.3);
    padding: 0.35em 0.9em;
    border-radius: 2px;
    margin-bottom: clamp(1rem,2.5vw,2rem);
    opacity: 0;
    transform: translateX(-20px);
    animation: slideIn 0.5s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  }

  h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2rem, 5.5vw, 4.5rem);
    color: var(--text);
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: clamp(0.8rem,2vw,1.5rem);
    opacity: 0;
    transform: translateY(30px);
    animation: riseUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
  }

  h1 span {
    color: var(--accent);
  }

  .sub {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(0.8rem, 1.5vw, 1.1rem);
    font-weight: 300;
    color: var(--text-dim);
    line-height: 1.6;
    max-width: 55ch;
    opacity: 0;
    transform: translateY(20px);
    animation: riseUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.65s forwards;
  }

  .footer-info {
    position: absolute;
    bottom: clamp(1.5rem,3vw,3rem);
    right: clamp(1.5rem,3vw,3rem);
    text-align: right;
    font-family: 'Noto Sans KR', sans-serif;
    opacity: 0;
    animation: fadeIn 0.6s ease 1s forwards;
  }

  .footer-info .brand {
    font-size: clamp(0.9rem, 1.5vw, 1.1rem);
    font-weight: 700;
    color: var(--text);
  }

  .footer-info .contact {
    font-size: clamp(0.65rem, 1vw, 0.8rem);
    color: var(--text-dim);
    margin-top: 0.25rem;
  }

  /* accent dot bottom-left */
  .accent-dot {
    position: absolute;
    bottom: clamp(1.5rem,3vw,3rem);
    left: clamp(2rem,5vw,5rem);
    width: clamp(6px,1vw,10px);
    height: clamp(6px,1vw,10px);
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent);
    opacity: 0;
    animation: fadeIn 0.4s ease 1.1s forwards;
  }

  @keyframes riseUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>
<section class="slide">
  <div class="accent-bar"></div>
  <div class="slide-num">01</div>

  <div class="tag">마케팅천재 · 2026 전략 가이드</div>
  <h1>왜 잘 나가는 원장님들은<br><span>'마케팅천재'</span>를 찾을까요?</h1>
  <p class="sub">1,000개+ 병원 마케팅 데이터가 증명하는<br>브랜드 블로그 × 플레이스 조합의 비밀</p>

  <div class="footer-info">
    <div class="brand">마케팅천재 · 대표 정귀명</div>
    <div class="contact">010-5848-9572</div>
  </div>
  <div class="accent-dot"></div>
</section>
</body>
</html>
