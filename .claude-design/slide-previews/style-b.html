<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Style B – Clean Split</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  :root {
    --blue: #1a6fd8;
    --dark: #0f1923;
    --light: #f4f7fa;
    --accent: #f0c040;
  }

  .slide {
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
  }

  /* Left panel — white */
  .panel-left {
    background: var(--light);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem,6vw,6rem);
    position: relative;
    overflow: hidden;
  }

  /* subtle circle decoration */
  .panel-left::after {
    content: '';
    position: absolute;
    bottom: calc(-1 * clamp(60px, 15vw, 180px));
    left: calc(-1 * clamp(60px, 10vw, 120px));
    width: clamp(200px, 40vw, 450px);
    height: clamp(200px, 40vw, 450px);
    border-radius: 50%;
    border: 2px solid rgba(26,111,216,0.12);
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(0.6rem, 0.9vw, 0.75rem);
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--blue);
    text-transform: uppercase;
    margin-bottom: clamp(1rem,2vw,2rem);
    opacity: 0;
    animation: fadeUp 0.5s ease 0.1s forwards;
  }

  h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(1.6rem, 3.5vw, 3.2rem);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.3;
    letter-spacing: -0.02em;
    margin-bottom: clamp(1rem,2vw,2rem);
    opacity: 0;
    animation: fadeUp 0.6s ease 0.3s forwards;
  }

  .divider {
    width: clamp(2rem, 5vw, 4rem);
    height: 3px;
    background: var(--blue);
    margin-bottom: clamp(0.8rem,1.5vw,1.5rem);
    opacity: 0;
    animation: expandW 0.5s ease 0.6s forwards;
    transform-origin: left;
    transform: scaleX(0);
  }

  .sub {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(0.75rem, 1.2vw, 0.95rem);
    font-weight: 300;
    color: #555;
    line-height: 1.7;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.7s forwards;
  }

  .contact-box {
    margin-top: clamp(1.5rem,3vw,3rem);
    padding: clamp(0.8rem,1.5vw,1.2rem) clamp(1rem,2vw,1.8rem);
    border-left: 3px solid var(--blue);
    background: rgba(26,111,216,0.05);
    display: inline-block;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.9s forwards;
  }

  .contact-box .name {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(0.8rem,1.2vw,1rem);
    font-weight: 500;
    color: var(--dark);
  }

  .contact-box .phone {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(0.7rem,1vw,0.85rem);
    color: #666;
    margin-top: 0.2rem;
  }

  /* Right panel — blue */
  .panel-right {
    background: var(--blue);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(2rem,6vw,6rem);
    position: relative;
    overflow: hidden;
  }

  /* large background number */
  .bg-num {
    position: absolute;
    bottom: -0.1em;
    right: -0.05em;
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(8rem, 20vw, 22rem);
    font-weight: 700;
    color: rgba(255,255,255,0.07);
    line-height: 1;
    pointer-events: none;
  }

  .stat {
    font-family: 'Noto Serif KR', serif;
    opacity: 0;
    animation: fadeLeft 0.7s ease 0.5s forwards;
  }

  .stat .num {
    font-size: clamp(2.5rem, 6vw, 6rem);
    font-weight: 700;
    color: #fff;
    line-height: 1;
    display: block;
  }

  .stat .num span {
    color: var(--accent);
  }

  .stat .label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(0.75rem, 1.2vw, 1rem);
    font-weight: 300;
    color: rgba(255,255,255,0.8);
    margin-top: 0.4rem;
    display: block;
  }

  .tag-list {
    margin-top: clamp(1.5rem,3vw,3rem);
    display: flex;
    flex-direction: column;
    gap: clamp(0.5rem, 1vw, 0.8rem);
    opacity: 0;
    animation: fadeLeft 0.7s ease 0.8s forwards;
  }

  .tag-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(0.7rem, 1.1vw, 0.9rem);
    font-weight: 400;
    color: rgba(255,255,255,0.85);
  }

  .tag-item::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes expandW {
    to { opacity: 1; transform: scaleX(1); }
  }
  @keyframes fadeLeft {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>
<section class="slide">
  <!-- Left: text -->
  <div class="panel-left">
    <div class="eyebrow">2026 병원 성장 전략 가이드</div>
    <h1>왜 잘 나가는<br>원장님들은<br>'마케팅천재'를<br>찾을까요?</h1>
    <div class="divider"></div>
    <p class="sub">수년 간 1,000개+ 병원 마케팅 데이터를<br>분석한 결과, 답은 명확했습니다.</p>
    <div class="contact-box">
      <div class="name">마케팅천재 · 대표 정귀명</div>
      <div class="phone">010-5848-9572</div>
    </div>
  </div>

  <!-- Right: stat -->
  <div class="panel-right">
    <div class="bg-num">∞</div>
    <div class="stat">
      <span class="num">1,000<span>+</span></span>
      <span class="label">병원 마케팅 데이터 분석</span>
    </div>
    <ul class="tag-list">
      <li class="tag-item">브랜드 블로그 × 플레이스 시너지</li>
      <li class="tag-item">신환 · 내방 폭발적 증가</li>
      <li class="tag-item">마케팅 ROAS 평균 1,000%+</li>
    </ul>
  </div>
</section>
</body>
</html>
